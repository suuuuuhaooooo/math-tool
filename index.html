    <style>
        :root {

        .hero h1 { color: var(--dark); font-weight: 700; letter-spacing: 2px; }
        
        .grade-card { 
            border: none; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.04); 
            border-top: 5px solid var(--primary); transition: transform 0.2s; background: white; 
        }
        .grade-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
        .grade-card-title { color: var(--dark); font-weight: 700; letter-spacing: 1px; }

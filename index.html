<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中小學數學無限計算題產生器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Noto Sans TC", sans-serif; }
        .hero { background: #ffffff; border-bottom: 1px solid #dee2e6; padding: 40px 0; margin-bottom: 30px; }
        .grade-card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: transform 0.2s; background: #fff; margin-bottom: 25px; }
        .grade-card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="hero text-center">
        <div class="container">
            <h1 class="fw-bold mb-2"><i class="fas fa-calculator text-primary me-2"></i>中小學數學無限計算題產生器</h1>
            <p class="text-muted mb-0">點選下方年段與工具，即可自動隨機出題，支援線上預覽、切換解答卷與 A4 完美列印 PDF。</p>
        </div>
    </div>

    <div class="container mb-5">
        <!-- 六年級專區 -->
        <div class="card grade-card shadow-sm">
            <div class="card-header bg-white fw-bold py-3 fs-5 text-primary">
                <i class="fas fa-graduation-cap me-2"></i>國小六年級數學專區
            </div>
            <div class="card-body">
                <div class="list-group list-group-flush">
                    <a href="grade6/index.html" class="list-group-item list-group-item-action py-3 d-flex justify-content-between align-items-center">
                        <div>
                            <span class="fw-bold fs-6">進入六年級題庫總覽</span>
                            <p class="text-muted small mb-0">包含第 1 章（因倍數）、第 2 章（分數除法）、第 4 章（小數除法）、第 5 章（比與比值）</p>
                        </div>
                        <i class="fas fa-chevron-right text-muted"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- 預留未來擴充區塊 -->
        <div class="card grade-card shadow-sm opacity-50">
            <div class="card-header bg-white fw-bold py-3 text-secondary">
                <i class="fas fa-school me-2"></i>國小五年級（即將推出）
            </div>
            <div class="card-body">
                <p class="text-muted small mb-0">敬請期待更多年段與單元擴充...</p>
            </div>
        </div>
    </div>

</body>
</html>

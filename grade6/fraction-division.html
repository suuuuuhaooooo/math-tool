<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分數除法計算練習產生器 - 庫口袋題庫</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Noto Sans TC", sans-serif; }
        
        /* 考卷容器基本樣式 */
        .sheet-box { 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            min-height: 800px;
            padding: 40px;
        }

        /* 題目間距與排版 */
        .math-problem { 
            font-size: 1.2rem; 
            margin-bottom: 25px; 
            line-height: 2.2; 
        }

        /* 考卷頂部個人資訊欄位 */
        .exam-header-info {
            display: none; /* 平時隱藏，列印時顯示 */
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* 專屬列印優化 (A4 專業排版) */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .sheet-box { 
                box-shadow: none !important; 
                padding: 0 !important; 
                margin: 0 !important;
                width: 100% !important;
            }
            .exam-header-info {
                display: flex !important;
                justify-content: space-between;
                font-size: 1rem;
                font-weight: bold;
            }
            /* 強制背景色與邊框列印清晰 */
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列（不列印） -->
    <nav class="navbar navbar-dark bg-dark navbar-expand-lg no-print">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-arrow-left me-2"></i>返回六上題庫首頁</a>
            <span class="navbar-text text-white-50">分數除法產生器</span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <!-- 左側控制面板（不列印） -->
            <div class="col-lg-3 no-print mb-4">
                <div class="card p-3 shadow-sm">
                    <h5 class="fw-bold mb-3">出題設定</h5>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">題數設定</label>
                        <select id="qCount" class="form-select form-select-sm">
                            <option value="10">10 題</option>
                            <option value="15" selected>15 題</option>
                            <option value="20">20 題</option>
                        </select>
                    </div>
                    <button id="btnGenerate" class="btn btn-primary w-100 mb-2"><i class="fas fa-shuffle me-1"></i> 換一批新題目</button>
                    <button id="btnPrint" class="btn btn-success w-100"><i class="fas fa-print me-1"></i> 列印 / 存成 PDF</button>
                </div>
            </div>

            <!-- 右側預覽與列印區 -->
            <div class="col-lg-9">
                <div class="sheet-box print-area">
                    
                    <!-- 列印專屬的班級姓名列 -->
                    <div class="exam-header-info">
                        <span>班級：___________</span>
                        <span>姓名：___________</span>
                        <span>座號：____</span>
                        <span>得分：_______</span>
                    </div>

                    <!-- 網頁瀏覽時的標題列 -->
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4 no-print">
                        <h3 class="fw-bold m-0" id="sheetTitle">國小六年級：分數除法練習</h3>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm active" id="tabQ">題目卷</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="tabA">答案卷</button>
                        </div>
                    </div>

                    <!-- 列印時顯示的純文字標題 -->
                    <div class="text-center mb-4 d-none d-print-block">
                        <h2 class="fw-bold" id="printSheetTitle">國小六年級：分數除法練習</h2>
                    </div>

                    <!-- 題目顯示區 -->
                    <div id="problemContainer" class="row">
                        <!-- 動態生成題目 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

        function simplify(n, d) {
            let common = gcd(Math.abs(n), Math.abs(d));
            return [n / common, d / common];
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        let currentProblems = [];

        function generateProblems() {
            const count = parseInt(document.getElementById('qCount').value);
            currentProblems = [];
            
            for (let i = 0; i < count; i++) {
                let d1 = getRandomInt(2, 9);
                let n1 = getRandomInt(1, d1 + 3);
                let d2 = getRandomInt(2, 9);
                let n2 = getRandomInt(1, d2 + 3);

                let ansN = n1 * d2;
                let ansD = d1 * n2;
                let [sN, sD] = simplify(ansN, ansD);

                // 答案如果是整數就直接顯示整數，否則顯示直立分數 LaTeX 格式
                let ansStr = sD === 1 ? `${sN}` : `\\(\\frac{${sN}}{${sD}}\\)`;
                
                currentProblems.push({
                    id: i + 1,
                    text: `\\( \\frac{${n1}}{${d1}} \\div \\frac{${n2}}{${d2}} = \\)`,
                    answer: ansStr
                });
            }
            renderSheet();
        }

        let isAnswerMode = false;

        function renderSheet() {
            const container = document.getElementById('problemContainer');
            container.innerHTML = '';

            currentProblems.forEach(p => {
                const col = document.createElement('div');
                // 兩欄排版（col-md-6），列印時看起來更像專業考卷
                col.className = 'col-md-6 math-problem';
                
                const displayVal = isAnswerMode 
                    ? `<span class="text-danger fw-bold ms-2">${p.answer}</span>` 
                    : `<span class="text-muted">_________________</span>`;
                
                col.innerHTML = `<strong>${p.id}.</strong> ${p.text} ${displayVal}`;
                container.appendChild(col);
            });

            // 觸發 MathJax 重新渲染直立分數
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        // 事件監聽
        document.getElementById('btnGenerate').addEventListener('click', generateProblems);
        document.getElementById('btnPrint').addEventListener('click', () => window.print());

        document.getElementById('tabQ').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabA').classList.remove('active');
            document.getElementById('sheetTitle').innerText = "國小六年級：分數除法練習";
            document.getElementById('printSheetTitle').innerText = "國小六年級：分數除法練習（題目卷）";
            isAnswerMode = false;
            renderSheet();
        });

        document.getElementById('tabA').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabQ').classList.remove('active');
            document.getElementById('sheetTitle').innerText = "國小六年級：分數除法練習（答案卷）";
            document.getElementById('printSheetTitle').innerText = "國小六年級：分數除法練習（答案卷）";
            isAnswerMode = true;
            renderSheet();
        });

        // 初始化
        generateProblems();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>

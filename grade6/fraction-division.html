<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第 2 章 分數除法計算練習產生器 - 庫口袋題庫</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; font-family: "Noto Sans TC", sans-serif; }
        
        /* 響應式 A4 預覽外觀：更柔和的陰影與乾淨的背景 */
        .sheet-box { 
            background: white; 
            width: 100%;
            max-width: 210mm;
            margin: 0 auto;
            border-radius: 8px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
            padding: 30px 20px; /* 手機版安全內距 */
            box-sizing: border-box;
        }

        /* 電腦版 A4 比例 */
        @media (min-width: 768px) {
            .sheet-box {
                padding: 20mm;
                min-height: 297mm;
            }
        }

        /* 題目排版：加大字體、放寬行高、絕不硬切字 */
        .math-problem { 
            font-size: 1.15rem; 
            margin-bottom: 28px; /* 增加各題之間的呼吸空間 */
            line-height: 2.2; 
            padding-left: 10px;
            padding-right: 10px;
        }

        /* 隱藏列印表頭，列印時才顯示 */
        .exam-header-info {
            display: none; 
            border-bottom: 2px solid #000;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        /* 標準 Word 風格 A4 列印設定 */
        @media print {
            @page {
                size: A4 portrait;
                /* 標準上下左右留白，請確認列印視窗的邊界設為「預設」 */
                margin: 15mm 20mm; 
            }
            .no-print { display: none !important; }
            body { background: white !important; margin: 0 !important; }
            
            .sheet-box { 
                box-shadow: none !important; 
                padding: 0 !important; /* 邊界交給 @page 處理，內部不再推擠 */
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                min-height: auto !important;
            }
            .exam-header-info {
                display: flex !important;
                justify-content: space-between;
                font-size: 1.1rem; /* 印出來的字體再稍微放大 */
                font-weight: bold;
            }
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark navbar-expand-lg no-print mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-arrow-left me-2"></i>返回國小六年級數學・無限計算題庫首頁</a>
            <span class="navbar-text text-white-50">第 2 章 分數除法無限產生器</span>
        </div>
    </nav>

    <div class="container px-2 px-md-3">
        <div class="row">
            <!-- 左側控制面板 -->
            <div class="col-lg-3 no-print mb-4">
                <div class="card p-3 shadow-sm border-0">
                    <h5 class="fw-bold mb-3 border-bottom pb-2">出題設定</h5>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold mb-2">選擇練習小節（可複選）</label>
                        <div class="form-check mb-1"><input class="form-check-input sub-cat" type="checkbox" value="2.1" id="c1" checked><label class="form-check-label small" for="c1">2.1 最簡分數化簡</label></div>
                        <div class="form-check mb-1"><input class="form-check-input sub-cat" type="checkbox" value="2.2" id="c2" checked><label class="form-check-label small" for="c2">2.2 同分母分數除法</label></div>
                        <div class="form-check mb-1"><input class="form-check-input sub-cat" type="checkbox" value="2.3" id="c3" checked><label class="form-check-label small" for="c3">2.3 異分母分數除法</label></div>
                        <div class="form-check mb-1"><input class="form-check-input sub-cat" type="checkbox" value="2.4" id="c4" checked><label class="form-check-label small" for="c4">2.4 商與被除數大小關係</label></div>
                        <div class="form-check"><input class="form-check-input sub-cat" type="checkbox" value="2.5" id="c5" checked><label class="form-check-label small" for="c5">2.5 求未知數 (\\(\\square\\))</label></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">排版版面</label>
                        <select id="layoutMode" class="form-select form-select-sm">
                            <option value="2" selected>雙欄排版（標準考卷）</option>
                            <option value="1">單欄排版（大字寬鬆）</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">題數設定（總分固定 100 分）</label>
                        <select id="qCount" class="form-select form-select-sm">
                            <option value="10">10 題（每題 10 分）</option>
                            <option value="20">20 題（每題 5 分）</option>
                            <option value="25" selected>25 題（每題 4 分）</option>
                            <option value="40">40 題（每題 2.5 分）</option>
                            <option value="50">50 題（每題 2 分）</option>
                            <option value="100">100 題（每題 1 分）</option>
                        </select>
                    </div>

                    <button id="btnGenerate" class="btn btn-primary w-100 mb-2 py-2"><i class="fas fa-shuffle me-1"></i> 換一批新題目</button>
                    <button id="btnPrint" class="btn btn-success w-100 py-2"><i class="fas fa-print me-1"></i> 列印 / 存成 PDF</button>
                </div>
            </div>

            <!-- 右側 A4 模擬預覽與列印區 -->
            <div class="col-lg-9 px-0 px-md-2 mb-5">
                <div class="sheet-box print-area">
                    
                    <div class="exam-header-info">
                        <span>班級：___________</span>
                        <span>姓名：___________</span>
                        <span>座號：____</span>
                        <span>得分：_______</span>
                    </div>

                    <div class="d-flex flex-wrap justify-content-between align-items-center border-bottom pb-3 mb-4 no-print gap-2">
                        <div>
                            <h3 class="fw-bold fs-4 m-0" id="sheetTitle">第 2 章 分數除法綜合練習</h3>
                            <small class="text-muted" id="scoreSubTitle">（每題 4 分，共 100 分）</small>
                        </div>
                        <div class="btn-group shadow-sm" role="group">
                            <button type="button" class="btn btn-outline-primary btn-sm active" id="tabQ">題目卷</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" id="tabA">答案卷</button>
                        </div>
                    </div>

                    <div class="text-center mb-4 d-none d-print-block">
                        <h2 class="fw-bold fs-4" id="printSheetTitle">第 2 章 分數除法練習（題目卷）</h2>
                        <p class="text-muted small" id="printScoreSubTitle">（每題 4 分，共 100 分）</p>
                    </div>

                    <div id="problemContainer" class="row">
                        <!-- 動態生成題目 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

        function simplify(n, d) {
            let common = gcd(Math.abs(n), Math.abs(d));
            return [n / common, d / common];
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        let currentProblems = [];

        function generateProblems() {
            const count = parseInt(document.getElementById('qCount').value);
            
            let scorePerQ = 100 / count;
            if (scorePerQ % 1 !== 0) {
                scorePerQ = scorePerQ.toFixed(1);
            }

            const checkboxes = document.querySelectorAll('.sub-cat:checked');
            let selectedCats = Array.from(checkboxes).map(cb => cb.value);

            if (selectedCats.length === 0) {
                selectedCats = ['2.1', '2.2', '2.3', '2.4', '2.5'];
            }

            const scoreText = `（每題 ${scorePerQ} 分，共 100 分）`;
            document.getElementById('scoreSubTitle').innerText = scoreText;
            document.getElementById('printScoreSubTitle').innerText = scoreText;

            currentProblems = [];
            
            for (let i = 0; i < count; i++) {
                let probText = "";
                let ansStr = "";
                let isFullWidth = false; // 關鍵：標記是否需要佔滿整行

                let mode = selectedCats[getRandomInt(0, selectedCats.length - 1)];

                if (mode === '2.1') {
                    let d = getRandomInt(6, 24);
                    let n = getRandomInt(2, d - 1);
                    let [sN, sD] = simplify(n, d);
                    if (sN === n) { n = sN * 2; d = sD * 2; }
                    
                    probText = `\\( \\frac{${n}}{${d}} = \\text{（化成最簡分數）} \\)`;
                    ansStr = `\\( \\frac{${sN}}{${sD}} \\)`;

                } else if (mode === '2.2') {
                    let d = getRandomInt(5, 15);
                    let n1 = getRandomInt(2, d - 1);
                    let n2 = getRandomInt(1, n1);
                    let [sN, sD] = simplify(n1, n2);
                    let ansVal = sD === 1 ? `${sN}` : `\\(\\frac{${sN}}{${sD}}\\)`;

                    probText = `\\( \\frac{${n1}}{${d}} \\div \\frac{${n2}}{${d}} = \\)`;
                    ansStr = ansVal;

                } else if (mode === '2.3') {
                    let d1 = getRandomInt(3, 10);
                    let n1 = getRandomInt(1, d1 + 2);
                    let d2 = getRandomInt(3, 10);
                    let n2 = getRandomInt(1, d2 + 2);

                    let ansN = n1 * d2;
                    let ansD = d1 * n2;
                    let [sN, sD] = simplify(ansN, ansD);
                    let ansVal = sD === 1 ? `${sN}` : `\\(\\frac{${sN}}{${sD}}\\)`;

                    probText = `\\( \\frac{${n1}}{${d1}} \\div \\frac{${n2}}{${d2}} = \\)`;
                    ansStr = ansVal;

                } else if (mode === '2.4') {
                    isFullWidth = true; // 關鍵：2.4 題型文字長，強制獨立佔滿一行
                    let d1 = getRandomInt(3, 9);
                    let n1 = getRandomInt(1, d1 + 3);

                    let relationType = getRandomInt(1, 3);
                    let divisorText = "";
                    let correctSymbol = "";

                    if (relationType === 1) {
                        let subD = getRandomInt(2, 5);
                        let subN = getRandomInt(subD + 1, subD + 4);
                        divisorText = `\\frac{${subN}}{${subD}}`;
                        correctSymbol = "&lt;"; // 小於
                    } else if (relationType === 2) {
                        let subD = getRandomInt(3, 8);
                        let subN = getRandomInt(1, subD - 1);
                        divisorText = `\\frac{${subN}}{${subD}}`;
                        correctSymbol = "&gt;"; // 大於
                    } else {
                        divisorText = "1";
                        correctSymbol = "="; // 等於
                    }

                    probText = `不用實際計算，判斷 \\( \\frac{${n1}}{${d1}} \\div ${divisorText} \\) 與 \\( \\frac{${n1}}{${d1}} \\) 的大小關係：`;
                    ansStr = `<strong>${correctSymbol}</strong>`;

                } else if (mode === '2.5') {
                    let d1 = getRandomInt(2, 8);
                    let n1 = getRandomInt(1, d1 + 2);
                    let d2 = getRandomInt(2, 8);
                    let n2 = getRandomInt(1, d2 + 2);

                    let ansN = n1 * d2;
                    let ansD = d1 * n2;
                    let [sN, sD] = simplify(ansN, ansD);

                    if (Math.random() > 0.5) {
                        probText = `\\( \\square \\div \\frac{${n2}}{${d2}} = \\frac{${sN}}{${sD}} \\)，\\(\\square = \\)`;
                        let orgN = sN * n2;
                        let orgD = sD * d2;
                        let [oN, oD] = simplify(orgN, orgD);
                        ansStr = oD === 1 ? `${oN}` : `\\(\\frac{${oN}}{${oD}}\\)`;
                    } else {
                        probText = `\\( \\frac{${n1}}{${d1}} \\div \\square = \\frac{${sN}}{${sD}} \\)，\\(\\square = \\)`;
                        let orgN = n1 * sD;
                        let orgD = d1 * sN;
                        let [oN, oD] = simplify(orgN, orgD);
                        ansStr = oD === 1 ? `${oN}` : `\\(\\frac{${oN}}{${oD}}\\)`;
                    }
                }

                currentProblems.push({
                    id: i + 1,
                    text: probText,
                    answer: ansStr,
                    fullWidth: isFullWidth // 綁定是否滿版的屬性
                });
            }
            renderSheet();
        }

        let isAnswerMode = false;

        function renderSheet() {
            const container = document.getElementById('problemContainer');
            container.innerHTML = '';
            
            const layoutMode = document.getElementById('layoutMode').value;

            currentProblems.forEach(p => {
                const col = document.createElement('div');
                
                // 如果是單欄模式，或是該題有標記需要滿版(例如 2.4)，就給 col-12
                if (layoutMode === '1' || p.fullWidth) {
                    col.className = 'col-12 math-problem';
                } else {
                    col.className = 'col-md-6 math-problem';
                }
                
                const displayVal = isAnswerMode 
                    ? `<span class="text-danger fw-bold ms-2 fs-5">${p.answer}</span>` 
                    : `<span class="text-muted ms-2">_________________</span>`;
                
                col.innerHTML = `<strong>${p.id}.</strong> ${p.text} ${displayVal}`;
                container.appendChild(col);
            });

            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        document.getElementById('btnGenerate').addEventListener('click', generateProblems);
        
        // 點擊列印時的小提示（可自行移除）
        document.getElementById('btnPrint').addEventListener('click', () => {
            window.print();
        });
        
        document.querySelectorAll('.sub-cat').forEach(el => el.addEventListener('change', generateProblems));
        document.getElementById('qCount').addEventListener('change', generateProblems);
        document.getElementById('layoutMode').addEventListener('change', renderSheet);

        document.getElementById('tabQ').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabA').classList.remove('active');
            document.getElementById('sheetTitle').innerText = "第 2 章 分數除法練習";
            document.getElementById('printSheetTitle').innerText = "第 2 章 分數除法練習（題目卷）";
            isAnswerMode = false;
            renderSheet();
        });

        document.getElementById('tabA').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabQ').classList.remove('active');
            document.getElementById('sheetTitle').innerText = "第 2 章 分數除法練習（答案卷）";
            document.getElementById('printSheetTitle').innerText = "第 2 章 分數除法練習（答案卷）";
            isAnswerMode = true;
            renderSheet();
        });

        generateProblems();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>

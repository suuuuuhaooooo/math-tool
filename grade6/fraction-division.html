<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第 2 章 分數除法計算練習產生器 - 庫口袋題庫</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Noto Sans TC", sans-serif; }
        
        .sheet-box { 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            min-height: 800px;
            padding: 40px;
        }

        .math-problem { 
            font-size: 1.15rem; 
            margin-bottom: 22px; 
            line-height: 2.2; 
        }

        .exam-header-info {
            display: none; 
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .sheet-box { 
                box-shadow: none !important; 
                padding: 0 !important; 
                margin: 0 !important;
                width: 100% !important;
            }
            .exam-header-info {
                display: flex !important;
                justify-content: space-between;
                font-size: 1rem;
                font-weight: bold;
            }
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark navbar-expand-lg no-print">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-arrow-left me-2"></i>返回六上題庫首頁</a>
            <span class="navbar-text text-white-50">第 2 章 分數除法進階產生器</span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <!-- 左側控制面板 -->
            <div class="col-lg-3 no-print mb-4">
                <div class="card p-3 shadow-sm">
                    <h5 class="fw-bold mb-3">出題設定</h5>
                    
                    <!-- 複選小節 -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold mb-1">選擇練習小節（可複選）</label>
                        <div class="form-check"><input class="form-check-input sub-cat" type="checkbox" value="2.1" id="c1" checked><label class="form-check-label small" for="c1">2.1 最簡分數化簡</label></div>
                        <div class="form-check"><input class="form-check-input sub-cat" type="checkbox" value="2.2" id="c2" checked><label class="form-check-label small" for="c2">2.2 同分母分數除法</label></div>
                        <div class="form-check"><input class="form-check-input sub-cat" type="checkbox" value="2.3" id="c3" checked><label class="form-check-label small" for="c3">2.3 異分母分數除法</label></div>
                        <div class="form-check"><input class="form-check-input sub-cat" type="checkbox" value="2.4" id="c4" checked><label class="form-check-label small" for="c4">2.4 分數除法應用題</label></div>
                        <div class="form-check"><input class="form-check-input sub-cat" type="checkbox" value="2.5" id="c5" checked><label class="form-check-label small" for="c5">2.5 求未知數 (\\(\\square\\))</label></div>
                    </div>

                    <!-- 題數設定（已擴充至 100 題） -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold">題數設定</label>
                        <select id="qCount" class="form-select form-select-sm">
                            <option value="10">10 題</option>
                            <option value="15" selected>15 題</option>
                            <option value="20">20 題</option>
                            <option value="25">25 題</option>
                            <option value="30">30 題</option>
                            <option value="40">40 題</option>
                            <option value="50">50 題</option>
                            <option value="75">75 題</option>
                            <option value="100">100 題</option>
                        </select>
                    </div>

                    <!-- 配分設定 -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold">每題配分</label>
                        <input type="number" id="qScore" class="form-control form-control-sm" value="5" min="1" max="100">
                    </div>

                    <button id="btnGenerate" class="btn btn-primary w-100 mb-2"><i class="fas fa-shuffle me-1"></i> 換一批新題目</button>
                    <button id="btnPrint" class="btn btn-success w-100"><i class="fas fa-print me-1"></i> 列印 / 存成 PDF</button>
                </div>
            </div>

            <!-- 右側預覽與列印區 -->
            <div class="col-lg-9">
                <div class="sheet-box print-area">
                    
                    <div class="exam-header-info">
                        <span>班級：___________</span>
                        <span>姓名：___________</span>
                        <span>座號：____</span>
                        <span>得分：_______</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4 no-print">
                        <div>
                            <h3 class="fw-bold m-0" id="sheetTitle">第 2 章 分數除法綜合練習</h3>
                            <small class="text-muted" id="scoreSubTitle">（每題 5 分，共 75 分）</small>
                        </div>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm active" id="tabQ">題目卷</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="tabA">答案卷</button>
                        </div>
                    </div>

                    <div class="text-center mb-4 d-none d-print-block">
                        <h2 class="fw-bold" id="printSheetTitle">第 2 章 分數除法練習（題目卷）</h2>
                        <p class="text-muted" id="printScoreSubTitle">（每題 5 分，共 75 分）</p>
                    </div>

                    <div id="problemContainer" class="row">
                        <!-- 動態生成題目 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

        function simplify(n, d) {
            let common = gcd(Math.abs(n), Math.abs(d));
            return [n / common, d / common];
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        let currentProblems = [];

        function generateProblems() {
            const count = parseInt(document.getElementById('qCount').value);
            const scorePerQ = parseInt(document.getElementById('qScore').value) || 5;
            
            const checkboxes = document.querySelectorAll('.sub-cat:checked');
            let selectedCats = Array.from(checkboxes).map(cb => cb.value);

            if (selectedCats.length === 0) {
                selectedCats = ['2.1', '2.2', '2.3', '2.4', '2.5'];
            }

            const totalScore = count * scorePerQ;
            const scoreText = `（每題 ${scorePerQ} 分，共 ${totalScore} 分）`;
            document.getElementById('scoreSubTitle').innerText = scoreText;
            document.getElementById('printScoreSubTitle').innerText = scoreText;

            currentProblems = [];
            
            for (let i = 0; i < count; i++) {
                let probText = "";
                let ansStr = "";

                let mode = selectedCats[getRandomInt(0, selectedCats.length - 1)];

                if (mode === '2.1') {
                    let d = getRandomInt(6, 24);
                    let n = getRandomInt(2, d - 1);
                    let [sN, sD] = simplify(n, d);
                    if (sN === n) { n = sN * 2; d = sD * 2; }
                    
                    probText = `\\( \\frac{${n}}{${d}} = \\text{（化成最簡分數）} \\)`;
                    ansStr = `\\( \\frac{${sN}}{${sD}} \\)`;

                } else if (mode === '2.2') {
                    let d = getRandomInt(5, 15);
                    let n1 = getRandomInt(2, d - 1);
                    let n2 = getRandomInt(1, n1);
                    let [sN, sD] = simplify(n1, n2);
                    let ansVal = sD === 1 ? `${sN}` : `\\(\\frac{${sN}}{${sD}}\\)`;

                    probText = `\\( \\frac{${n1}}{${d}} \\div \\frac{${n2}}{${d}} = \\)`;
                    ansStr = ansVal;

                } else if (mode === '2.3') {
                    let d1 = getRandomInt(3, 10);
                    let n1 = getRandomInt(1, d1 + 2);
                    let d2 = getRandomInt(3, 10);
                    let n2 = getRandomInt(1, d2 + 2);

                    let ansN = n1 * d2;
                    let ansD = d1 * n2;
                    let [sN, sD] = simplify(ansN, ansD);
                    let ansVal = sD === 1 ? `${sN}` : `\\(\\frac{${sN}}{${sD}}\\)`;

                    probText = `\\( \\frac{${n1}}{${d1}} \\div \\frac{${n2}}{${d2}} = \\)`;
                    ansStr = ansVal;

                } else if (mode === '2.4') {
                    let d1 = getRandomInt(3, 8);
                    let n1 = getRandomInt(d1 + 1, d1 + 5);
                    let d2 = getRandomInt(2, 6);
                    let n2 = getRandomInt(1, d2);

                    let ansN = n1 * d2;
                    let ansD = d1 * n2;
                    let [sN, sD] = simplify(ansN, ansD);
                    let ansVal = sD === 1 ? `${sN}` : `\\(\\frac{${sN}}{${sD}}\\)`;

                    probText = `有一條長 \\(\\frac{${n1}}{${d1}}\\) 公尺的帶子，每 \\(\\frac{${n2}}{${d2}}\\) 公尺剪成一段，共可剪成多少段？答：`;
                    ansStr = `${ansVal} 段`;

                } else if (mode === '2.5') {
                    let d1 = getRandomInt(2, 8);
                    let n1 = getRandomInt(1, d1 + 2);
                    let d2 = getRandomInt(2, 8);
                    let n2 = getRandomInt(1, d2 + 2);

                    let ansN = n1 * d2;
                    let ansD = d1 * n2;
                    let [sN, sD] = simplify(ansN, ansD);

                    if (Math.random() > 0.5) {
                        probText = `\\( \\square \\div \\frac{${n2}}{${d2}} = \\frac{${sN}}{${sD}} \\)，\\(\\square = \\)`;
                        let orgN = sN * n2;
                        let orgD = sD * d2;
                        let [oN, oD] = simplify(orgN, orgD);
                        ansStr = oD === 1 ? `${oN}` : `\\(\\frac{${oN}}{${oD}}\\)`;
                    } else {
                        probText = `\\( \\frac{${n1}}{${d1}} \\div \\square = \\frac{${sN}}{${sD}} \\)，\\(\\square = \\)`;
                        let orgN = n1 * sD;
                        let orgD = d1 * sN;
                        let [oN, oD] = simplify(orgN, orgD);
                        ansStr = oD === 1 ? `${oN}` : `\\(\\frac{${oN}}{${oD}}\\)`;
                    }
                }

                currentProblems.push({
                    id: i + 1,
                    text: probText,
                    answer: ansStr
                });
            }
            renderSheet();
        }

        let isAnswerMode = false;

        function renderSheet() {
            const container = document.getElementById('problemContainer');
            container.innerHTML = '';

            currentProblems.forEach(p => {
                const col = document.createElement('div');
                col.className = 'col-md-6 math-problem';
                
                const displayVal = isAnswerMode 
                    ? `<span class="text-danger fw-bold ms-2">${p.answer}</span>` 
                    : `<span class="text-muted">_________________</span>`;
                
                col.innerHTML = `<strong>${p.id}.</strong> ${p.text} ${displayVal}`;
                container.appendChild(col);
            });

            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        document.getElementById('btnGenerate').addEventListener('click', generateProblems);
        document.getElementById('btnPrint').addEventListener('click', () => window.print());
        
        document.querySelectorAll('.sub-cat').forEach(el => el.addEventListener('change', generateProblems));
        document.getElementById('qCount').addEventListener('change', generateProblems);
        document.getElementById('qScore').addEventListener('input', generateProblems);

        document.getElementById('tabQ').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabA').classList.remove('active');
            document.getElementById('sheetTitle').innerText = "第 2 章 分數除法練習";
            document.getElementById('printSheetTitle').innerText = "第 2 章 分數除法練習（題目卷）";
            isAnswerMode = false;
            renderSheet();
        });

        document.getElementById('tabA').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabQ').classList.remove('active');
            document.getElementById('sheetTitle').innerText = "第 2 章 分數除法練習（答案卷）";
            document.getElementById('printSheetTitle').innerText = "第 2 章 分數除法練習（答案卷）";
            isAnswerMode = true;
            renderSheet();
        });

        generateProblems();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>

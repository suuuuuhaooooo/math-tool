<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分數除法計算練習產生器 - 庫口袋題庫</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Noto Sans TC", sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-area { background: white !important; box-shadow: none !important; padding: 0 !important; }
        }
        .sheet-box { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); min-height: 800px; }
        .math-problem { font-size: 1.15rem; margin-bottom: 20px; line-height: 2; }
    </style>
</head>
<body>

    <!-- 頂部導覽列（不列印） -->
    <nav class="navbar navbar-dark bg-dark navbar-expand-lg no-print">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-arrow-left me-2"></i>返回六上題庫首頁</a>
            <span class="navbar-text text-white-50">分數除法產生器</span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <!-- 左側控制面板 -->
            <div class="col-lg-3 no-print mb-4">
                <div class="card p-3 shadow-sm">
                    <h5 class="fw-bold mb-3">出題設定</h5>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">題數設定</label>
                        <select id="qCount" class="form-select form-select-sm">
                            <option value="10">10 題</option>
                            <option value="15" selected>15 題</option>
                            <option value="20">20 題</option>
                        </select>
                    </div>
                    <button id="btnGenerate" class="btn btn-primary w-100 mb-2"><i class="fas fa-shuffle me-1"></i> 換一批新題目</button>
                    <button id="btnPrint" class="btn btn-success w-100"><i class="fas fa-print me-1"></i> 列印 / 存成 PDF</button>
                </div>
            </div>

            <!-- 右側預覽與列印區 -->
            <div class="col-lg-9">
                <div class="sheet-box p-4 print-area">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                        <h3 class="fw-bold m-0" id="sheetTitle">國小六年級：分數除法練習</h3>
                        <div class="btn-group no-print" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm active" id="tabQ">題目卷</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="tabA">答案卷</button>
                        </div>
                    </div>

                    <!-- 題目顯示區 -->
                    <div id="problemContainer" class="row">
                        <!-- 動態生成題目 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 簡單的分數化簡工具 (最大公因數)
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

        function simplify(n, d) {
            let common = gcd(Math.abs(n), Math.abs(d));
            return [n / common, d / common];
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        let currentProblems = [];

        function generateProblems() {
            const count = parseInt(document.getElementById('qCount').value);
            currentProblems = [];
            
            for (let i = 0; i < count; i++) {
                // 產生分數 A ÷ 分數 B
                let d1 = getRandomInt(2, 9);
                let n1 = getRandomInt(1, d1 + 3);
                let d2 = getRandomInt(2, 9);
                let n2 = getRandomInt(1, d2 + 3);

                // 計算答案: (n1/d1) / (n2/d2) = (n1 * d2) / (d1 * n2)
                let ansN = n1 * d2;
                let ansD = d1 * n2;
                let [sN, sD] = simplify(ansN, ansD);

                let ansStr = sD === 1 ? `${sN}` : `${sN} / ${sD}`;
                
                currentProblems.push({
                    id: i + 1,
                    text: `\\( \\frac{${n1}}{${d1}} \\div \\frac{${n2}}{${d2}} = \\)`,
                    answer: `\\( ${ansStr} \\)`
                });
            }
            renderSheet();
        }

        let isAnswerMode = false;

        function renderSheet() {
            const container = document.getElementById('problemContainer');
            container.innerHTML = '';
        
            currentProblems.forEach(p => {
                const col = document.createElement('div');
                col.className = 'col-md-6 math-problem';
                const displayVal = isAnswerMode ? `<span class="text-danger fw-bold">${p.answer}</span>` : `( ${p.id} ) _________________`;
                col.innerHTML = `<strong>${p.id}.</strong> ${p.text} &nbsp; ${displayVal}`;
                container.appendChild(col);
            });
        
            // 關鍵：每次動態更新完畫面後，讓 MathJax 重新渲染新產生的公式
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        // 事件監聽
        document.getElementById('btnGenerate').addEventListener('click', generateProblems);
        document.getElementById('btnPrint').addEventListener('click', () => window.print());

        document.getElementById('tabQ').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabA').classList.remove('active');
            document.getElementById('sheetTitle').innerText = "國小六年級：分數除法練習（題目卷）";
            isAnswerMode = false;
            renderSheet();
        });

        document.getElementById('tabA').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabQ').classList.remove('active');
            document.getElementById('sheetTitle').innerText = "國小六年級：分數除法練習（答案卷）";
            isAnswerMode = true;
            renderSheet();
        });

        // 初始化
        generateProblems();
    </script>
    <!-- 引入 MathJax 讓分數顯示更漂亮 -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>

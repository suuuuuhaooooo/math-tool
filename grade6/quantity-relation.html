<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第 3 章 數量關係計算練習產生器 - 庫口袋題庫</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; font-family: "Noto Sans TC", sans-serif; }
        
        .sheet-box { 
            background: white; 
            width: 100%;
            max-width: 210mm;
            margin: 0 auto;
            border-radius: 8px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
            padding: 30px 20px;
            box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .sheet-box {
                padding: 25mm 20mm;
                min-height: 297mm;
            }
        }

        .problem-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between; 
        }
        
        .math-problem { 
            width: calc(50% - 15px);
            font-size: 1.15rem; 
            margin-bottom: 35px; 
            line-height: 2.2; 
        }

        .problem-grid.single-column .math-problem,
        .math-problem.full-width {
            width: 100%;
        }

        .exam-header-info {
            display: none; 
            border-bottom: 2px solid #000;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 25mm 20mm !important; 
            }
            .no-print { display: none !important; }
            body { background: white !important; margin: 0 !important; padding: 0 !important; }
            
            .sheet-box { 
                box-shadow: none !important; 
                padding: 0 !important; 
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                min-height: auto !important;
                border: none !important;
            }
            
            .exam-header-info {
                display: flex !important;
                justify-content: space-between;
                font-size: 1.1rem; 
                font-weight: bold;
                padding-top: 10px !important; 
            }

            #problemContainer {
                display: block !important; 
            }
            
            .problem-grid.single-column .math-problem,
            .math-problem.full-width {
                display: block !important;
                width: 100% !important;
                clear: both !important;
                margin-bottom: 35px !important;
            }

            .math-problem {
                display: inline-block !important;
                width: 48% !important; 
                vertical-align: top !important;
                margin-bottom: 35px !important;
                page-break-inside: avoid !important; 
                break-inside: avoid !important;
            }

            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }

        @supports (-webkit-touch-callout: none) {
            @media print {
                .sheet-box {
                    padding: 25mm 20mm !important;
                    box-sizing: border-box !important;
                }
            }
        }
    </style>
</head>
<body>

    <div class="modal fade" id="mobileAlertModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered px-3">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-warning text-dark border-0">
                    <h5 class="modal-title fw-bold"><i class="fas fa-lightbulb me-2"></i>溫馨提示</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <p class="mb-0 fs-5">為了獲得最佳的排版與列印體驗，<br>強烈建議您使用 <strong>「電腦」</strong> 來操作喔！</p>
                </div>
                <div class="modal-footer border-0 justify-content-center">
                    <button type="button" class="btn btn-dark px-5" data-bs-dismiss="modal">我知道了</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-dark bg-dark navbar-expand-lg no-print mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-arrow-left me-2"></i>返回六年級題庫首頁</a>
            <span class="navbar-text text-white-50">第 3 章 數量關係產生器</span>
        </div>
    </nav>

    <div class="container px-2 px-md-3">
        <div class="row">
            <div class="col-lg-3 no-print mb-4">
                <div class="card p-3 shadow-sm border-0">
                    <h5 class="fw-bold mb-3 border-bottom pb-2">出題設定</h5>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold mb-2">選擇練習題型（可複選）</label>
                        <div class="form-check mb-1"><input class="form-check-input sub-cat" type="checkbox" value="sequence" id="c1" checked><label class="form-check-label small" for="c1">3.1 數形與等差規律</label></div>
                        <div class="form-check mb-1"><input class="form-check-input sub-cat" type="checkbox" value="interval" id="c2" checked><label class="form-check-label small" for="c2">3.3 間隔與植樹問題</label></div>
                        <div class="form-check mb-1"><input class="form-check-input sub-cat" type="checkbox" value="relation" id="c3" checked><label class="form-check-label small" for="c3">3.2 和差積商變化規律</label></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">排版版面</label>
                        <select id="layoutMode" class="form-select form-select-sm">
                            <option value="2" selected>雙欄排版（標準考卷）</option>
                            <option value="1">單欄排版（大字寬鬆）</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">題數設定（總分 100 分）</label>
                        <select id="qCount" class="form-select form-select-sm">
                            <option value="10">10 題（每題 10 分）</option>
                            <option value="20">20 題（每題 5 分）</option>
                            <option value="25" selected>25 題（每題 4 分）</option>
                            <option value="40">40 題（每題 2.5 分）</option>
                            <option value="50">50 題（每題 2 分）</option>
                            <option value="100">100 題（每題 1 分）</option>
                        </select>
                    </div>

                    <button id="btnGenerate" class="btn btn-primary w-100 mb-2 py-2"><i class="fas fa-shuffle me-1"></i> 換一批新題目</button>
                    <button id="btnPrint" class="btn btn-success w-100 py-2"><i class="fas fa-print me-1"></i> 列印 / 存成 PDF</button>
                </div>
            </div>

            <div class="col-lg-9 px-0 px-md-2 mb-5">
                <div class="sheet-box print-area">
                    
                    <div class="exam-header-info">
                        <span>班級：___________</span>
                        <span>姓名：___________</span>
                        <span>座號：____</span>
                        <span>得分：_______</span>
                    </div>

                    <div class="d-flex flex-wrap justify-content-between align-items-center border-bottom pb-3 mb-4 no-print gap-2">
                        <div>
                            <h3 class="fw-bold fs-4 m-0" id="sheetTitle">第 3 章 數量關係綜合練習</h3>
                            <small class="text-muted" id="scoreSubTitle">（每題 4 分，共 100 分）</small>
                        </div>
                        <div class="btn-group shadow-sm" role="group">
                            <button type="button" class="btn btn-outline-primary btn-sm active" id="tabQ">題目卷</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" id="tabA">答案卷</button>
                        </div>
                    </div>

                    <div class="text-center mb-4 d-none d-print-block">
                        <h2 class="fw-bold fs-4" id="printSheetTitle">第 3 章 數量關係練習（題目卷）</h2>
                        <p class="text-muted small" id="printScoreSubTitle">（每題 4 分，共 100 分）</p>
                    </div>

                    <div id="problemContainer" class="problem-grid">
                        <!-- 動態生成題目 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.innerWidth < 768) {
                var mobileModal = new bootstrap.Modal(document.getElementById('mobileAlertModal'));
                mobileModal.show();
            }
        });

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        let currentProblems = [];

        function generateProblems() {
            const count = parseInt(document.getElementById('qCount').value);
            
            let scorePerQ = 100 / count;
            if (scorePerQ % 1 !== 0) {
                scorePerQ = scorePerQ.toFixed(1);
            }

            const checkboxes = document.querySelectorAll('.sub-cat:checked');
            let selectedCats = Array.from(checkboxes).map(cb => cb.value);

            if (selectedCats.length === 0) {
                selectedCats = ['sequence', 'interval', 'relation'];
            }

            const scoreText = `（每題 ${scorePerQ} 分，共 100 分）`;
            document.getElementById('scoreSubTitle').innerText = scoreText;
            document.getElementById('printScoreSubTitle').innerText = scoreText;

            currentProblems = [];
            
            for (let i = 0; i < count; i++) {
                let probText = "";
                let ansStr = "";
                let isFullWidth = false; 

                let mode = selectedCats[getRandomInt(0, selectedCats.length - 1)];

                if (mode === 'sequence') {
                    // 等差數列規律：首項 a，公差 d，求第 n 項
                    let a = getRandomInt(2, 9);
                    let d = getRandomInt(2, 6);
                    let n = getRandomInt(8, 15);
                    let ans = a + (n - 1) * d;
                    
                    let term2 = a + d;
                    let term3 = a + 2 * d;
                    probText = `有一數列按照規律排列：${a}、${term2}、${term3}、...，求此數列的第 ${n} 個數是多少？`;
                    ansStr = `${ans}`;

                } else if (mode === 'interval') {
                    // 間隔與植樹問題
                    isFullWidth = true;
                    let type = getRandomInt(1, 3); // 1: 兩端都種, 2: 兩端都不種, 3: 封閉圓形/周長
                    let distance = getRandomInt(5, 15) * 10; // 全長 50~150
                    let interval = getRandomInt(2, 5) * 5;  // 間隔 10~20
                    let countTrees;

                    if (distance % interval !== 0) distance = interval * getRandomInt(4, 8);

                    if (type === 1) {
                        countTrees = (distance / interval) + 1;
                        probText = `在一條長 ${distance} 公尺的直線步道**兩端都種樹**，每隔 ${interval} 公尺種一棵，共可種幾棵樹？`;
                    } else if (type === 2) {
                        countTrees = (distance / interval) - 1;
                        probText = `在一條長 ${distance} 公尺的直線步道**兩端都不種樹**，每隔 ${interval} 公尺種一棵，共可種幾棵樹？`;
                    } else {
                        countTrees = distance / interval;
                        probText = `在一個周長 ${distance} 公尺的圓形花圃四周，每隔 ${interval} 公尺放一盆花，共可放幾盆花？`;
                    }
                    ansStr = `${countTrees} 棵`;

                } else if (mode === 'relation') {
                    // 和差積商變化
                    let subType = getRandomInt(1, 2);
                    if (subType === 1) {
                        let originalA = getRandomInt(20, 50);
                        let originalB = getRandomInt(5, 15);
                        let mult = getRandomInt(2, 5);
                        let newA = originalA * mult;
                        let ans = originalB * mult;
                        probText = `已知 \\( ${originalA} \\div ${originalB} = ${originalA / originalB} \\)。若被除數擴大為 \\( ${newA} \\)（除數不變），則商會變成多少？`;
                        ansStr = `${ans}`;
                    } else {
                        let originalA = getRandomInt(40, 100);
                        let originalB = getRandomInt(10, 30);
                        let addVal = getRandomInt(5, 20);
                        let newA = originalA + addVal;
                        let newB = originalB + addVal;
                        // (A+x) - (B+x) = A - B
                        let ans = newA - newB;
                        probText = `已知兩數的和或差規律：若大數與小數同時加上 ${addVal}，已知原本兩數相差 \\( ${originalA - originalB} \\)，則改變後的兩數相差多少？`;
                        ansStr = `${originalA - originalB}`;
                    }
                }

                currentProblems.push({
                    id: i + 1,
                    text: probText,
                    answer: ansStr,
                    fullWidth: isFullWidth 
                });
            }
            renderSheet();
        }

        let isAnswerMode = false;

        function renderSheet() {
            const container = document.getElementById('problemContainer');
            container.innerHTML = '';
            
            const layoutMode = document.getElementById('layoutMode').value;
            
            if (layoutMode === '1') {
                container.classList.add('single-column');
            } else {
                container.classList.remove('single-column');
            }

            currentProblems.forEach(p => {
                const col = document.createElement('div');
                col.className = 'math-problem';
                
                if (p.fullWidth) {
                    col.classList.add('full-width');
                }
                
                const displayVal = isAnswerMode 
                    ? `<span class="text-danger fw-bold ms-2 fs-5">${p.answer}</span>` 
                    : `<span class="text-muted ms-2">_________________</span>`;
                
                col.innerHTML = `<strong>${p.id}.</strong> ${p.text} ${displayVal}`;
                container.appendChild(col);
            });

            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        document.getElementById('btnGenerate').addEventListener('click', generateProblems);
        
        document.getElementById('btnPrint').addEventListener('click', () => {
            window.print();
        });
        
        document.querySelectorAll('.sub-cat').forEach(el => el.addEventListener('change', generateProblems));
        document.getElementById('qCount').addEventListener('change', generateProblems);
        document.getElementById('layoutMode').addEventListener('change', renderSheet);

        document.getElementById('tabQ').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabA').classList.remove('active');
            document.getElementById('sheetTitle').innerText = "第 3 章 數量關係綜合練習";
            document.getElementById('printSheetTitle').innerText = "第 3 章 數量關係練習（題目卷）";
            isAnswerMode = false;
            renderSheet();
        });

        document.getElementById('tabA').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabQ').classList.remove('active');
            document.getElementById('sheetTitle').innerText = "第 3 章 數量關係綜合練習（答案卷）";
            document.getElementById('printSheetTitle').innerText = "第 3 章 數量關係練習（答案卷）";
            isAnswerMode = true;
            renderSheet();
        });

        generateProblems();
    </script>
</body>
</html>

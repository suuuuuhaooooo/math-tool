<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小六年級數學・無限計算題產生器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Noto Sans TC", sans-serif; }
        .hero { background: #ffffff; border-bottom: 1px solid #dee2e6; padding: 30px 0; margin-bottom: 30px; }
        .chapter-card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: transform 0.2s; background: #fff; }
        .chapter-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="hero text-center">
        <div class="container">
            <h1 class="fw-bold mb-2">國小六年級數學・無限計算題庫</h1>
            <p class="text-muted mb-0">依據六上數學課綱設計，隨機無限出題，支援線上預覽、切換解答卷與 A4 列印 PDF。</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-4">
            
            <!-- 第 1 章 -->
            <div class="col-md-6">
                <div class="card chapter-card p-4 h-100">
                    <h5 class="fw-bold text-primary mb-3"><i class="fas fa-book-open me-2"></i>第 1 章：最大公因數和最小公倍數</h5>
                    <div class="list-group list-group-flush">
                        <a href="factors.html" class="list-group-item list-group-item-action border-0 px-0">1.2 ~ 1.4 質因數分解、最大公因數與最小公倍數</a>
                    </div>
                </div>
            </div>

            <!-- 第 2 章 -->
            <div class="col-md-6">
                <div class="card chapter-card p-4 h-100">
                    <h5 class="fw-bold text-primary mb-3"><i class="fas fa-book-open me-2"></i>第 2 章：分數除法</h5>
                    <div class="list-group list-group-flush">
                        <a href="fraction-division.html" class="list-group-item list-group-item-action border-0 px-0">2.1 ~ 2.4 最簡分數與分數除法計算題庫</a>
                    </div>
                </div>
            </div>

            <!-- 第 4 章 -->
            <div class="col-md-6">
                <div class="card chapter-card p-4 h-100">
                    <h5 class="fw-bold text-primary mb-3"><i class="fas fa-book-open me-2"></i>第 4 章：小數除法</h5>
                    <div class="list-group list-group-flush">
                        <a href="decimal-division.html" class="list-group-item list-group-item-action border-0 px-0">4.1 ~ 4.3 整數與小數互除計算題庫</a>
                    </div>
                </div>
            </div>

            <!-- 第 5 章 -->
            <div class="col-md-6">
                <div class="card chapter-card p-4 h-100">
                    <h5 class="fw-bold text-primary mb-3"><i class="fas fa-book-open me-2"></i>第 5 章：比與比值</h5>
                    <div class="list-group list-group-flush">
                        <a href="ratio.html" class="list-group-item list-group-item-action border-0 px-0">5.1 ~ 5.3 求比值與最簡整數比</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
